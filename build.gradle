buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.+'
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'java'
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version       = project.mod_version
group         = project.maven_group
archivesBaseName = project.archives_base_name

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { reterraforged { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { reterraforged { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run')
            args '--mod', 'reterraforged', '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
            mods { reterraforged { source sourceSets.main } }
        }
    }
}

sourceSets.main.resources {
    srcDirs += ['src/generated/resources']
}

mixin {
    add sourceSets.main, 'reterraforged.refmap.json'
    config 'reterraforged.mixins.json'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://jitpack.io' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    // Mixin annotation processor - generates refmap at compile time
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // TerraBlender (optional - compile-only for compat mixins)
    compileOnly "com.github.glitchfiend:TerraBlender-forge:${project.minecraft_version}-${project.terrablender_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    inputs.property 'forgeVersion', project.forge_version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version, forgeVersion: project.forge_version
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : project.mod_id,
            'Specification-Vendor'    : 'raccoonman',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'raccoonman',
            'MixinConfigs'            : 'reterraforged.mixins.json'
        ])
    }
}

jar.finalizedBy('reobfJar')
